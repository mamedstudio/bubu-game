<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUBU - English for Little Hearts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* CAPA - LOGO */
        .logo-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeOutLogo 0.8s ease-in 2.5s forwards;
        }

        .logo-screen img {
            max-width: 80%;
            max-height: 70%;
            animation: logoPop 0.6s ease-out;
        }

        @keyframes logoPop {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeOutLogo {
            to { opacity: 0; visibility: hidden; }
        }

        /* CENÁRIO DA CIDADE */
        .city-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            background: url('assets/backgrounds/city.webp') center/cover;
            animation: fadeInCity 1s ease-in 2.5s forwards;
        }

        @keyframes fadeInCity {
            to { opacity: 1; }
        }

        /* BUBU ANDANDO */
        .bubu-walking {
            position: fixed;
            bottom: 10%;
            left: -250px;
            width: 200px;
            height: 200px;
            background: url('assets/characters/bubu-walk.webp') center/contain no-repeat;
            animation: walkAcross 3s ease-out 3.5s forwards;
            z-index: 100;
        }

        @keyframes walkAcross {
            0% { left: -250px; }
            100% { left: calc(50% - 100px); }
        }

        .bubu-standing {
            position: fixed;
            bottom: 10%;
            left: calc(50% - 100px);
            width: 200px;
            height: 200px;
            background: url('assets/characters/bubu-standing.webp') center/contain no-repeat;
            opacity: 0;
            animation: showBubu 0.5s ease-out 6.5s forwards;
            z-index: 100;
        }

        @keyframes showBubu {
            to { opacity: 1; }
        }

        /* BALÃO DE FALA */
        .speech-bubble {
            position: fixed;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border-radius: 40px;
            padding: 25px 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            opacity: 0;
            z-index: 200;
            min-width: 280px;
            text-align: center;
        }

        .speech-bubble.show {
            animation: bubblePop 0.5s ease-out 6.5s forwards;
        }

        @keyframes bubblePop {
            0% { opacity: 0; transform: translateX(-50%) scale(0); }
            70% { transform: translateX(-50%) scale(1.1); }
            100% { opacity: 1; transform: translateX(-50%) scale(1); }
        }

        .speech-text {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2196F3;
        }

        /* BOTÃO START */
        .start-btn {
            position: fixed;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #FF6B6B 0%, #FFA07A 100%);
            color: white;
            border: none;
            padding: 25px 60px;
            font-size: 2.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
            opacity: 0;
            z-index: 300;
            font-family: 'Comic Sans MS', sans-serif;
            animation: showBtn 0.5s ease-out 9s forwards, pulse 2s ease-in-out 9s infinite;
        }

        @keyframes showBtn {
            to { opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
        }

        /* BOTÃO SKIP */
        .skip-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #FF6B6B;
            border-radius: 25px;
            color: #FF6B6B;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            font-family: 'Comic Sans MS', sans-serif;
            transition: all 0.3s ease;
        }

        .skip-btn:hover {
            background: #FF6B6B;
            color: white;
        }

        /* TELA DO JOGO */
        .game-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center bottom;
            z-index: 400;
        }

        .game-screen.active {
            display: block;
        }

        .game-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px;
        }

        .game-logo {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 500;
            background: white;
            border-radius: 30px;
            padding: 10px 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .game-logo img {
            height: 50px;
        }

        .level-indicator {
            background: white;
            border-radius: 20px;
            padding: 10px 30px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
        }

        .cards-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding: 20px;
            margin-top: 50px;
        }

        .card {
            width: 180px;
            height: 180px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            opacity: 0;
            transform: scale(0);
            position: relative;
            overflow: hidden;
        }

        .card.visible {
            opacity: 1;
            transform: scale(1);
            animation: cardBounce 0.6s ease-out;
        }

        @keyframes cardBounce {
            0% { transform: scale(0); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .card img {
            width: 85%;
            height: 85%;
            object-fit: contain;
        }

        .card.correct {
            animation: correctZoom 1s ease;
            border: 8px solid #4CAF50;
            z-index: 10;
        }

        @keyframes correctZoom {
            0% { transform: scale(1); }
            20% { transform: scale(1.5); }
            40% { transform: scale(1.5); }
            60% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .card.wrong {
            animation: shake 0.6s ease;
            border: 8px solid #FF9800;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-20px); }
            75% { transform: translateX(20px); }
        }

        .bubu-game {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 180px;
            background: url('assets/characters/bubu-standing.webp') center/contain no-repeat;
            z-index: 500;
        }

        .bubu-game.celebrate {
            background: url('assets/characters/bubu-celebrate.webp') center/contain no-repeat;
            animation: bubuJump 0.8s ease;
        }

        @keyframes bubuJump {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-30px); }
        }

        .bubu-speech {
            position: absolute;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            border-radius: 25px;
            padding: 15px 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            white-space: nowrap;
            font-size: 1.3rem;
            font-weight: bold;
            color: #2196F3;
        }

        .congrats-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 600;
            justify-content: center;
            align-items: center;
        }

        .congrats-screen.active {
            display: flex;
        }

        .congrats-content {
            background: white;
            border-radius: 40px;
            padding: 40px 60px;
            text-align: center;
            animation: congratsPop 0.6s ease-out;
        }

        @keyframes congratsPop {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .congrats-title {
            font-size: 3rem;
            color: #4CAF50;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .congrats-text {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 30px;
        }

        .next-level-btn {
            background: linear-gradient(135deg, #4CAF50 0%, #66BB6A 100%);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
            font-family: 'Comic Sans MS', sans-serif;
            transition: all 0.3s ease;
        }

        .next-level-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(76, 175, 80, 0.6);
        }

        .confetti {
            position: fixed;
            width: 12px;
            height: 12px;
            pointer-events: none;
            z-index: 700;
            animation: confettiFall 3s linear forwards;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 500;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        @media (max-width: 768px) {
            .card {
                width: 130px;
                height: 130px;
            }

            .bubu-walking,
            .bubu-standing,
            .bubu-game {
                width: 150px;
                height: 150px;
            }

            .speech-text {
                font-size: 1.8rem;
            }

            .congrats-title {
                font-size: 2.5rem;
            }

            .congrats-text {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- CAPA -->
    <div class="logo-screen">
        <img src="assets/logo/bubu-logo.webp" alt="BUBU Logo">
    </div>

    <div class="city-screen"></div>
    <div class="bubu-walking"></div>
    <div class="bubu-standing"></div>

    <div class="speech-bubble" id="speechBubble">
        <div class="speech-text" id="speechText">Hi! I'm BUBU!</div>
    </div>

    <button class="start-btn" id="startBtn">START ▶</button>
    <button class="skip-btn" id="skipBtn">️ Skip</button>

    <!-- JOGO -->
    <div class="game-screen" id="gameScreen">
        <div class="game-logo">
            <img src="assets/logo/bubu-logo.webp" alt="BUBU">
        </div>

        <div class="game-content">
            <div class="level-indicator" id="levelIndicator">Level 1: Fruits</div>
            
            <div class="cards-container" id="cardsContainer">
                <!-- Cards gerados pelo JavaScript -->
            </div>
        </div>

        <div class="bubu-game" id="bubuGame">
            <div class="bubu-speech" id="bubuSpeech">Where is the Apple?</div>
        </div>

        <div class="controls">
            <button class="control-btn" id="soundBtn" title="Repetir">🔊</button>
            <button class="control-btn" id="homeBtn" title="Início">🏠</button>
        </div>
    </div>

    <!-- CONGRATULATIONS -->
    <div class="congrats-screen" id="congratsScreen">
        <div class="congrats-content">
            <div class="congrats-title">Congratulations! 🎉</div>
            <div class="congrats-text" id="congratsText">You completed Level 1!</div>
            <button class="next-level-btn" id="nextLevelBtn">Next Level →</button>
        </div>
    </div>

    <script>
        // DADOS DO JOGO
        const levels = [
            {
                name: 'Fruits',
                background: 'url("assets/backgrounds/classroom.webp") center/cover',
                items: [
                    { word: 'Apple', image: 'assets/fruits/Apple.webp' },
                    { word: 'Banana', image: 'assets/fruits/Banana.webp' },
                    { word: 'Grape', image: 'assets/fruits/Grape.webp' },
                    { word: 'Orange', image: 'assets/fruits/Orange.webp' },
                    { word: 'Strawberry', image: 'assets/fruits/Strawberry.webp' }
                ]
            },
            {
                name: 'Animals',
                background: 'url("assets/backgrounds/park.webp") center/cover',
                items: [
                    { word: 'Dog', image: 'assets/animals/Dog.webp' },
                    { word: 'Cat', image: 'assets/animals/Cat.webp' },
                    { word: 'Rabbit', image: 'assets/animals/Rabbit.webp' },
                    { word: 'Fish', image: 'assets/animals/Fish.webp' },
                    { word: 'Bird', image: 'assets/animals/Bird.webp' }
                ]
            },
            {
                name: 'Objects',
                background: 'url("assets/backgrounds/bedroom.webp") center/cover',
                items: [
                    { word: 'Ball', image: 'assets/objects/Ball.webp' },
                    { word: 'Book', image: 'assets/objects/Book.webp' },
                    { word: 'Car', image: 'assets/objects/Car.webp' },
                    { word: 'Star', image: 'assets/objects/Star.webp' },
                    { word: 'Lollipop', image: 'assets/objects/Lollipop.webp' }
                ]
            }
        ];

        let currentLevel = 0;
        let currentItem = null;
        let isAnswering = false;
        let synth = window.speechSynthesis;

        // Elementos DOM
        const startBtn = document.getElementById('startBtn');
        const skipBtn = document.getElementById('skipBtn');
        const gameScreen = document.getElementById('gameScreen');
        const cardsContainer = document.getElementById('cardsContainer');
        const levelIndicator = document.getElementById('levelIndicator');
        const bubuGame = document.getElementById('bubuGame');
        const bubuSpeech = document.getElementById('bubuSpeech');
        const congratsScreen = document.getElementById('congratsScreen');
        const congratsText = document.getElementById('congratsText');
        const nextLevelBtn = document.getElementById('nextLevelBtn');
        const soundBtn = document.getElementById('soundBtn');
        const homeBtn = document.getElementById('homeBtn');

        // PLAYER DE ÁUDIO
        const audioPlayer = {
            openingMusic: new Audio('assets/audio/abertura.mp3'),
            backgroundMusic: new Audio('assets/audio/trilha.mp3'),
            
            isMuted: false,
            currentVolume: 1.0,
            
            init() {
                this.openingMusic.volume = this.currentVolume;
                this.backgroundMusic.volume = this.currentVolume * 0.8;
                this.backgroundMusic.loop = true;
                
                this.openingMusic.addEventListener('ended', () => {
                    this.startBackground();
                });
            },
            
            playOpening() {
                if (!this.isMuted) {
                    this.openingMusic.currentTime = 0;
                    this.openingMusic.play().catch(err => console.warn('⚠️ Auto-play blocked:', err));
                }
            },
            
            startBackground() {
                if (!this.isMuted) {
                    this.backgroundMusic.currentTime = 0;
                    this.backgroundMusic.play().catch(err => console.warn('⚠️ Background blocked:', err));
                }
            },
            
            stopBackground() {
                this.backgroundMusic.pause();
                this.backgroundMusic.currentTime = 0;
            },
            
            toggleMute() {
                this.isMuted = !this.isMuted;
                if (this.isMuted) {
                    this.openingMusic.pause();
                    this.backgroundMusic.pause();
                } else {
                    if (!this.openingMusic.paused) this.openingMusic.play();
                    else if (!this.backgroundMusic.paused) this.backgroundMusic.play();
                }
                return this.isMuted;
            }
        };

        audioPlayer.init();

        // SEQUÊNCIA DA CAPA
        window.addEventListener('load', () => {
            setTimeout(() => {
                setTimeout(() => {
                    audioPlayer.playOpening();
                    
                    setTimeout(() => {
                        document.querySelector('.speech-bubble').classList.add('show');
                        speak("Hi! I'm BUBU!", () => {
                            setTimeout(() => {
                                document.getElementById('speechText').textContent = "Let's play!";
                                speak("Let's play!");
                            }, 800);
                        });
                    }, 3500);
                    
                }, 500);
                
            }, 2500);
            
            setTimeout(() => {
                if (document.querySelector('.logo-screen').style.display !== 'none') {
                    document.getElementById('startBtn').click();
                }
            }, 16000);
        });

        // BOTÃO SKIP
        skipBtn.addEventListener('click', () => {
            audioPlayer.openingMusic.pause();
            audioPlayer.openingMusic.currentTime = 0;
            
            document.querySelector('.logo-screen').style.display = 'none';
            document.querySelector('.city-screen').style.display = 'none';
            document.querySelector('.bubu-walking').style.display = 'none';
            document.querySelector('.bubu-standing').style.display = 'none';
            document.querySelector('.speech-bubble').style.display = 'none';
            document.getElementById('startBtn').style.display = 'none';
            skipBtn.style.display = 'none';
            
            gameScreen.classList.add('active');
            audioPlayer.startBackground();
            loadLevel(0);
        });

        // INICIAR JOGO
        startBtn.addEventListener('click', () => {
            gameScreen.classList.add('active');
            skipBtn.style.display = 'none';
            audioPlayer.stopBackground();
            audioPlayer.startBackground();
            loadLevel(0);
        });

        // CARREGAR FASE
        function loadLevel(levelIndex) {
            currentLevel = levelIndex;
            const level = levels[levelIndex];
            
            gameScreen.style.background = level.background;
            levelIndicator.textContent = `Level ${levelIndex + 1}: ${level.name}`;
            
            setTimeout(() => {
                speak(`Let's play ${level.name}!`, () => {
                    setTimeout(() => {
                        loadRound();
                    }, 500);
                });
            }, 500);
        }

        // CARREGAR RODADA
        function loadRound() {
            isAnswering = true;
            cardsContainer.innerHTML = '';
            
            const level = levels[currentLevel];
            const shuffled = [...level.items].sort(() => Math.random() - 0.5);
            const roundItems = shuffled.slice(0, 3);
            currentItem = roundItems[Math.floor(Math.random() * 3)];
            
            bubuSpeech.textContent = `Where is the ${currentItem.word}?`;
            speak(`Where is the ${currentItem.word}?`, null, true);
            
            roundItems.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="${item.image}" alt="${item.word}">`;
                
                setTimeout(() => {
                    card.classList.add('visible');
                }, index * 200);
                
                card.addEventListener('click', (e) => handleAnswer(item, card, e));
                cardsContainer.appendChild(card);
            });
        }

        // VERIFICAR RESPOSTA
        function handleAnswer(selected, card, event) {
            if (!isAnswering) return;
            
            if (selected.word === currentItem.word) {
                isAnswering = false;
                card.classList.add('correct');
                bubuGame.classList.add('celebrate');
                
                bubuSpeech.textContent = `${selected.word}! Great job!`;
                speak(`${selected.word}! ${selected.word}! Great job!`, () => {
                    setTimeout(() => {
                        createConfetti();
                        
                        setTimeout(() => {
                            showCongratulations();
                        }, 1500);
                    }, 1000);
                }, true);
                
            } else {
                card.classList.add('wrong');
                bubuSpeech.textContent = 'Try again!';
                speak('Try again! You can do it!');
                
                setTimeout(() => {
                    card.classList.remove('wrong');
                }, 600);
            }
        }

        // CONGRATULATIONS
        function showCongratulations() {
            congratsText.textContent = `You completed Level ${currentLevel + 1}!`;
            congratsScreen.classList.add('active');
            speak('Congratulations!');
        }

        // PRÓXIMA FASE
        nextLevelBtn.addEventListener('click', () => {
            congratsScreen.classList.remove('active');
            bubuGame.classList.remove('celebrate');
            
            if (currentLevel < levels.length - 1) {
                loadLevel(currentLevel + 1);
            } else {
                congratsText.textContent = 'You completed all levels! ';
                congratsScreen.classList.add('active');
                speak('You completed all levels! Amazing!');
                
                setTimeout(() => {
                    location.reload();
                }, 3000);
            }
        });

        // CONTROLES
        soundBtn.addEventListener('click', () => {
            if (currentItem) {
                speak(`Where is the ${currentItem.word}?`, null, true);
            }
        });

        homeBtn.addEventListener('click', () => {
            if (confirm('Go back to start?')) {
                location.reload();
            }
        });

        // ÁUDIO
        function speak(text, callback, repeat = false) {
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            utterance.pitch = 1.3;
            
            if (callback) {
                utterance.onend = callback;
            }
            
            synth.speak(utterance);
            
            if (repeat) {
                setTimeout(() => {
                    synth.speak(new SpeechSynthesisUtterance(text));
                }, 1500);
            }
        }

        // CONFETES
        function createConfetti() {
            const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4CAF50', '#8BC34A', '#CDDC39', '#FFEB3B', '#FFC107', '#FF9800', '#FF5722'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 4000);
                }, i * 40);
            }
        }
    </script>

</body>
</html>
